name: Hosted Browser QA

on:
  workflow_dispatch:
    inputs:
      expected_site_sha:
        description: 'Approved full SHA of the current Main and Pages deployment'
        required: true
        type: string
      expected_deployment_id:
        description: 'Approved github-pages Deployment API ID'
        required: true
        type: string

permissions:
  contents: read
  actions: read
  deployments: read
  pages: read

concurrency:
  group: hosted-browser-qa
  cancel-in-progress: false

jobs:
  hosted-qa:
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && github.repository == 'LuceatLuxVestra42/Langrisser-2nd-test'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      EXPECTED_SITE_SHA: ${{ inputs.expected_site_sha }}
      EXPECTED_DEPLOYMENT_ID: ${{ inputs.expected_deployment_id }}
      HOSTED_URL: https://luceatluxvestra42.github.io/Langrisser-2nd-test/
      QA_INFRASTRUCTURE_SHA: ${{ github.workflow_sha }}
    steps:
      - name: Seed failure evidence and validate inputs
        id: initialize
        shell: bash
        run: |
          set -euo pipefail
          [[ "${RUNNER_TEMP:-}" = /* && "$RUNNER_TEMP" != / ]]
          [[ "${GITHUB_RUN_ID:-}" =~ ^[0-9]+$ && "${GITHUB_RUN_ATTEMPT:-}" =~ ^[0-9]+$ ]]
          export QA_RESULT_DIR="$RUNNER_TEMP/hosted-results-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          export BROWSER_QA_RUNTIME_ROOT="$RUNNER_TEMP/hosted-runtime-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          export PLAYWRIGHT_BROWSERS_PATH="$BROWSER_QA_RUNTIME_ROOT/browsers"
          export PLAYWRIGHT_PACKAGE_ROOT="$BROWSER_QA_RUNTIME_ROOT/node"
          printf '%s\n' "QA_RESULT_DIR=$QA_RESULT_DIR" "BROWSER_QA_RUNTIME_ROOT=$BROWSER_QA_RUNTIME_ROOT" \
            "PLAYWRIGHT_BROWSERS_PATH=$PLAYWRIGHT_BROWSERS_PATH" "PLAYWRIGHT_PACKAGE_ROOT=$PLAYWRIGHT_PACKAGE_ROOT" >> "$GITHUB_ENV"
          test ! -e "$QA_RESULT_DIR"
          mkdir -p "$QA_RESULT_DIR"
          node -e 'require("fs").writeFileSync(process.env.QA_RESULT_DIR + "/result.json", JSON.stringify({overallStatus:"NOT_VERIFIED",runId:process.env.GITHUB_RUN_ID,jobName:process.env.GITHUB_JOB,reason:"Runner did not complete; inspect workflow steps"},null,2))'
          printf '%s\n' 'evidence_ready=true' >> "$GITHUB_OUTPUT"
          [[ "$EXPECTED_SITE_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$EXPECTED_DEPLOYMENT_ID" =~ ^[0-9]+$ ]]

      - name: Checkout exact trusted QA Infrastructure
        uses: actions/checkout@v4
        with:
          ref: ${{ github.workflow_sha }}
          path: qa-infrastructure
          persist-credentials: false

      - name: Checkout approved Site Source for byte comparison
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.expected_site_sha }}
          path: site-source
          persist-credentials: false

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Validate runner failure fixtures without Hosted access
        run: node qa-infrastructure/tools/test-hosted-browser-qa.mjs --self-test

      - name: Install isolated pinned Playwright and Chromium
        shell: bash
        run: |
          set -euo pipefail
          test ! -e "$BROWSER_QA_RUNTIME_ROOT"
          mkdir -p "$PLAYWRIGHT_PACKAGE_ROOT"
          printf '{"private":true}\n' > "$PLAYWRIGHT_PACKAGE_ROOT/package.json"
          npm_config_cache="$BROWSER_QA_RUNTIME_ROOT/npm-cache" npm install --prefix "$PLAYWRIGHT_PACKAGE_ROOT" --no-save --package-lock=false playwright@1.62.1
          "$PLAYWRIGHT_PACKAGE_ROOT/node_modules/.bin/playwright" install --with-deps chromium

      - name: Verify Deployment, probe Hosted URL, then run Browser QA
        env:
          GH_TOKEN: ${{ github.token }}
          QA_INFRASTRUCTURE_ROOT: ${{ github.workspace }}/qa-infrastructure
          SITE_SOURCE_ROOT: ${{ github.workspace }}/site-source
        run: xvfb-run -a node qa-infrastructure/tools/test-hosted-browser-qa.mjs

      - name: Clean only this run's temporary runtime
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          [[ "${RUNNER_TEMP:-}" = /* && "$RUNNER_TEMP" != / ]]
          [[ "${GITHUB_RUN_ID:-}" =~ ^[0-9]+$ && "${GITHUB_RUN_ATTEMPT:-}" =~ ^[0-9]+$ ]]
          if [[ -z "${BROWSER_QA_RUNTIME_ROOT:-}" || -z "${QA_RESULT_DIR:-}" ]]; then
            echo '::error::Runtime paths were not initialized; no deletion performed'
            exit 1
          fi
          [[ "$BROWSER_QA_RUNTIME_ROOT" = "$RUNNER_TEMP"/hosted-runtime-"$GITHUB_RUN_ID"-"$GITHUB_RUN_ATTEMPT" ]]
          [[ "$QA_RESULT_DIR" = "$RUNNER_TEMP"/hosted-results-"$GITHUB_RUN_ID"-"$GITHUB_RUN_ATTEMPT" ]]
          rm -rf -- "$BROWSER_QA_RUNTIME_ROOT"
          test ! -e "$BROWSER_QA_RUNTIME_ROOT"
          if [[ ! -f "$QA_RESULT_DIR/result.json" ]]; then
            echo '::error::Initial result was not created; artifact evidence is unavailable'
            exit 1
          fi
          if [[ -d qa-infrastructure ]]; then
            node qa-infrastructure/tools/test-hosted-browser-qa.mjs --finalize
          fi

      - name: Preserve success or failure evidence
        if: always() && steps.initialize.outputs.evidence_ready == 'true'
        id: artifact
        uses: actions/upload-artifact@v4
        with:
          name: hosted-qa-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ env.QA_RESULT_DIR }}/
          if-no-files-found: error
          retention-days: 14

      - name: Require successful evidence upload
        if: always()
        env:
          ARTIFACT_OUTCOME: ${{ steps.artifact.outcome }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$ARTIFACT_OUTCOME" != success ]]; then
            echo '::error::Evidence upload did not succeed; inspect initialization and artifact steps'
            exit 1
          fi
          if [[ -f qa-infrastructure/tools/test-hosted-browser-qa.mjs ]]; then
            node qa-infrastructure/tools/test-hosted-browser-qa.mjs --verify-upload
          fi
