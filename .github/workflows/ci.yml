name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Validate M01 Skin identity owner
        run: node tools/validate-skin-identities.mjs

      - name: Test M01 Skin identity failure boundaries
        run: node tools/test-skin-identities.mjs

      - name: Validate M02 Skin-to-Hero ownership
        run: node tools/validate-skin-hero-relations-m02.mjs

      - name: Test M02 Skin-to-Hero ownership failure boundaries
        run: node tools/test-skin-hero-relations-m02.mjs

      - name: Validate M02 Skin source array positions
        run: node tools/validate-skin-source-orders-m02.mjs

      - name: Test M02 Skin source array position failure boundaries
        run: node tools/test-skin-source-orders-m02.mjs

      - name: Validate M03 Skin Generated consumer
        run: node tools/validate-skin-generated.mjs

      - name: Test M03 Skin Generated consumer failure boundaries
        run: node tools/test-skin-generated.mjs

      - name: Set up Python for Skin fullart Asset validation
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Skin fullart image validator dependency
        run: python -m pip install Pillow==13.0.0

      - name: Validate M04 Skin fullart Assets
        run: python tools/validate-skin-fullart-m04.py

      - name: Test M04 Skin fullart Asset failure boundaries
        run: python tools/test-skin-fullart-m04.py

      - name: Validate M04 Skin fullart presentation contract
        run: node tools/validate-skin-fullart-presentation-m04.mjs

      - name: Test M04 Skin fullart presentation failure boundaries
        run: node tools/test-skin-fullart-presentation-m04.mjs

      - name: Validate M05-C Skin 601 independent admission and internal Consumer
        run: node tools/validate-skin-admission-m05-c.mjs
      - name: Test M05-C Skin 601 admission failure boundaries
        run: node tools/test-skin-admission-m05-c.mjs

      - name: Generate M05-G dynamic Skin projections
        run: node tools/generate-skin-m05-g.mjs

      - name: Fail if committed M05-G projections were stale
        run: git diff --exit-code -- generated/skin-consumer-composed-m05-g.v1.json generated/skin-consumer-public-m05-g.v1.json generated/skin-assets-public-m05-g.v1.json

      - name: Validate M05-G composition, Asset Registry and publication intersection
        run: node tools/validate-skin-m05-g.mjs

      - name: Test M05-G composition and approval failure boundaries
        run: node tools/test-skin-m05-g.mjs

      - name: Validate M06 Hero 6 Skin 602-606 semantic admissions
        run: node tools/validate-skin-admission-m06.mjs
      - name: Test M06 Hero 6 semantic admission failure boundaries
        run: node tools/test-skin-admission-m06.mjs

      - name: Validate M05-D Skin 601 Fullart Asset Admission
        run: python tools/validate-skin-fullart-m05-d.py

      - name: Test M05-D Skin 601 Asset Admission failure boundaries
        run: python tools/test-skin-fullart-m05-d.py

      - name: Validate M06 Hero 6 Skin Fullart Asset Admission
        run: python tools/validate-skin-fullart-m06.py
      - name: Test M06 Fullart Asset Admission failure boundaries
        run: python tools/test-skin-fullart-m06.py

      - name: Validate M05-E Skin publication and Hero Fullart
        run: node tools/validate-skin-publication-m05-e.mjs

      - name: Test M05-E publication path and approval failure boundaries
        run: node tools/test-skin-publication-m05-e.mjs

      - name: Test read-only Skin Source Snapshot change classification
        run: node tools/test-skin-source-diff-m05-g.mjs

      - name: Test static resource cache-key contract
        run: node tools/test-app-cache-key.mjs

      - name: Validate static resource cache-key contract
        run: node tools/validate-app-cache-key.mjs

      - name: Validate Hero presentation slice
        run: node tools/validate.mjs

      - name: Test Hero JobLevel raw stats
        run: node tools/test-hero-job-level-raw-stats.mjs

      - name: Validate Faction identity owner
        run: node tools/validate-faction-identities.mjs

      - name: Validate Hero-Faction relation owner
        run: node tools/validate-hero-faction-relations.mjs

      - name: Validate Faction Korean localization
        run: node tools/validate-faction-ko-localization.mjs

      - name: Test Faction Korean localization
        run: node tools/test-faction-ko-localization.mjs

      - name: Validate Production identity owner
        run: node tools/validate-production-identities.mjs

      - name: Test Production identity owner
        run: node tools/test-production-identities.mjs

      - name: Validate Production Korean localization
        run: node tools/validate-production-ko-localization.mjs

      - name: Test Production Korean localization
        run: node tools/test-production-ko-localization.mjs

