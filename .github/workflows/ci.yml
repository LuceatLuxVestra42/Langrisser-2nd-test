      - name: Test SP Soldier Korean localization
        run: node tools/test-sp-soldier-ko-localization.mjs

      - name: Validate Soldier provenance integrity
        run: node tools/validate-soldier-provenance.mjs

      - name: Test Soldier provenance integrity
        run: node tools/test-soldier-provenance.mjs

      - name: Validate Soldier raw growth stats
        run: node tools/validate-soldier-raw-growth-stats.mjs

      - name: Test Soldier raw growth stats admission
