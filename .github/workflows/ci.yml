      - name: Test Hero-Soldier generated presentation regressions
        run: node tools/test-hero-soldier-presentation.mjs

      - name: Test Soldier-to-Hero navigation and exact pair parity
        run: node tools/test-soldier-hero-navigation.mjs

      - name: Test SP-to-NORMAL Soldier navigation and exact pair parity
        run: node tools/test-sp-normal-soldier-navigation.mjs

      - name: Test Hero-to-Soldier navigation and exact pair parity
        run: node tools/test-hero-soldier-navigation.mjs

      - name: Test NORMAL and SP Soldier search and filtered navigation
