<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="icon" href="data:,">
    <meta name="description" content="검증된 데이터만 사용하는 랑그릿사 영웅 정보의 첫 화면 조각입니다.">
    <title>랑그릿사 영웅 — 첫 데이터 조각</title>
    <link rel="stylesheet" href="./styles.css">
    <script type="module" src="./app.js"></script>
  </head>
  <body>
    <main class="page">
      <header class="page-heading">
        <p class="eyebrow">랑그릿사 · 데이터 조각</p>
        <h1>영웅</h1>
        <p class="summary">검증된 영웅 3명의 데이터와 한국어 전직 표시명을 보여줍니다. 영웅 한국어명과 희귀도는 아직 포함하지 않습니다.</p>
      </header>
      <section id="heroes" class="hero-grid" aria-label="영웅 목록" aria-live="polite">
        <p class="status">영웅 정보를 불러오는 중…</p>
      </section>
      <section class="sp-soldier-section" aria-labelledby="sp-soldier-title">
        <header class="section-heading">
          <p class="eyebrow">현재 admitted population</p>
          <h2 id="sp-soldier-title">SP 용병</h2>
          <p class="summary">현재 canonical SP 용병 56명의 한국어명, 연결된 일반 용병 ID, 기본 능력치를 표시합니다.</p>
        </header>
        <div id="sp-soldiers" class="sp-soldier-grid" aria-label="SP 용병 목록" aria-live="polite">
          <p class="status">SP 용병 정보를 불러오는 중…</p>
        </div>
      </section>
    </main>
  </body>
</html>
